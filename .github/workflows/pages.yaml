name: Deploy GitHub Pages

# Replaces the legacy branch-based Pages build (was: source = main /docs).
# This workflow publishes an HTML-only static site copy from docs/ and deploys
# it via the official actions/deploy-pages action. The Markdown sources stay in
# the repo, but only rendered HTML files are exposed on GitHub Pages.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# Allow GITHUB_TOKEN to deploy to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time; cancel in-progress runs on new push.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Assemble HTML-only site
        run: |
          set -euo pipefail
          rm -rf site
          mkdir -p site
          rsync -a --prune-empty-dirs --include='*/' --include='*.html' --exclude='*' docs/ site/
          touch site/.nojekyll

      - name: Upload site/ as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
